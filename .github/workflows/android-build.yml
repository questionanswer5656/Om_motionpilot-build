name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify uploaded source
        run: |
          test -f AndroidMotionGestureApp_v2_CLOUD_BUILD.zip
          rm -rf work
          mkdir work
          unzip -q AndroidMotionGestureApp_v2_CLOUD_BUILD.zip -d work
          test -f work/AndroidMotionGestureApp/settings.gradle.kts
          test -f work/AndroidMotionGestureApp/build.gradle.kts
          test -f work/AndroidMotionGestureApp/app/build.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/work/AndroidMotionGestureApp" >> "$GITHUB_ENV"
          echo "Project root: $GITHUB_WORKSPACE/work/AndroidMotionGestureApp"
          ls -la "$GITHUB_WORKSPACE/work/AndroidMotionGestureApp"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;35.0.0|platform-tools' || true

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          java -version
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          ls -lah "$PROJECT_DIR/app/build/outputs/apk/release/"
          test -n "$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motionpilot-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
