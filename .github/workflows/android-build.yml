name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract uploaded source
        run: |
          test -f AndroidMotionGestureApp_v2_CLOUD_BUILD.zip
          rm -rf work
          mkdir work
          unzip -q AndroidMotionGestureApp_v2_CLOUD_BUILD.zip -d work
          test -f work/AndroidMotionGestureApp/settings.gradle.kts
          test -f work/AndroidMotionGestureApp/build.gradle.kts
          test -f work/AndroidMotionGestureApp/app/build.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/work/AndroidMotionGestureApp" >> "$GITHUB_ENV"
          echo "Project root: $GITHUB_WORKSPACE/work/AndroidMotionGestureApp"
          ls -la "$GITHUB_WORKSPACE/work/AndroidMotionGestureApp"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and setup Gradle 9.6.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          export GRADLE=/tmp/gradle-9.6/bin/gradle
          echo "GRADLE=$GRADLE" >> "$GITHUB_ENV"
          echo "GRADLE=$GRADLE" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        run: |
          sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-37"
          yes | sdkmanager --licenses

      - name: Patch compileSdk if android-37 unavailable
        run: |
          if ! sdkmanager --list_installed 2>/dev/null | grep -q "platforms;android-37"; then
            sdkmanager --install "platforms;android-35"
            sed -i 's/compileSdk 37/compileSdk 35/' "$PROJECT_DIR/app/build.gradle.kts"
            echo "Patched compileSdk from 37 to 35"
          fi

      - name: Print versions
        run: |
          java -version
          $GRADLE --version

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $GRADLE :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          ls -lah "$PROJECT_DIR/app/build/outputs/apk/release/"
          test -n "$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motionpilot-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
