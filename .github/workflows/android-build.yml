name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf work
          mkdir work
          unzip -q AndroidMotionGestureApp_v2_CLOUD_BUILD.zip -d work
          PROJECT_DIR="$(find work -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 9.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.6/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" -ls
          test -n "$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motionpilot-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
